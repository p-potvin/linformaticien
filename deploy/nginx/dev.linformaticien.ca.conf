# L'Informaticien — dev / staging (tailnet only)
# Installed at: /etc/nginx/sites-available/dev.linformaticien.ca.conf
# Document root is a symlink flipped by every successful webhook deploy.
#
# Same allow/deny shape as docs.vaultwares.ca: the vhost listens publicly so
# ACME HTTP-01 can complete, but everything except the challenge path is
# restricted to the tailnet.
#
# Requires:
#   - public DNS A record  dev.linformaticien.ca -> 173.249.194.15 (for ACME)
#   - dnsmasq host-record  dev.linformaticien.ca -> 100.73.93.84   (for tailnet)
#
# Mise à jour : Wed, 12 Aug 2026 10:14

server {
  listen 80;
  listen [::]:80;
  server_name dev.linformaticien.ca;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name dev.linformaticien.ca;

  allow 127.0.0.1;
  allow 100.64.0.0/10;
  deny all;

  root /var/www/linformaticien/dev;
  index index.html;

  ssl_certificate /etc/letsencrypt/live/dev.linformaticien.ca/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dev.linformaticien.ca/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Staging must never be indexed, even if the allow list is ever loosened.
  add_header X-Robots-Tag "noindex, nofollow" always;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  access_log /var/log/nginx/linformaticien-dev.access.log;
  error_log  /var/log/nginx/linformaticien-dev.error.log;
}
