# L'Informaticien — production (public)
# Installed at: /etc/nginx/sites-available/linformaticien.ca.conf
# Document root is a symlink flipped by promote-linformaticien.sh.
#
# linformaticien.ca is the only canonical host. The two .top domains and every
# www. variant answer with a 301 so the brand has exactly one indexed address.
#
# Mise à jour : Fri, 14 Aug 2026 01:09

# --- ACME + plain HTTP -------------------------------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name linformaticien.ca www.linformaticien.ca
              letechnicien.top www.letechnicien.top
              le.technicien.top;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://linformaticien.ca$request_uri;
  }
}

# --- Redirect the alternate domains to the canonical one ---------------------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name www.linformaticien.ca
              letechnicien.top www.letechnicien.top
              le.technicien.top;

  ssl_certificate /etc/letsencrypt/live/linformaticien.ca/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/linformaticien.ca/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://linformaticien.ca$request_uri;
}

# --- The site itself ---------------------------------------------------------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name linformaticien.ca;

  root /var/www/linformaticien/prod;
  index index.html;

  ssl_certificate /etc/letsencrypt/live/linformaticien.ca/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/linformaticien.ca/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # nginx does NOT merge add_header across levels: a location that declares an
  # add_header of its own loses every header set higher up. These three are
  # therefore repeated in each location that sets a cache header below — sans
  # quoi la page principale partirait sans aucun en-tête de sécurité.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Vite writes content-hashed filenames into /assets, so they are safe to
  # cache forever. index.html must never be cached or a promotion looks like
  # it did nothing.
  location /assets/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Les polices sont auto-hébergées et copiées telles quelles depuis `public/`,
  # donc sans empreinte dans le nom. Elles sont malgré tout immuables : changer
  # de police veut dire changer de nom de fichier (voir src/styles/fonts.css).
  location /fonts/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  access_log /var/log/nginx/linformaticien.access.log;
  error_log  /var/log/nginx/linformaticien.error.log;
}
