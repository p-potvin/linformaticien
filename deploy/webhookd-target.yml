# Snippet to add under `targets:` in /etc/vw-webhookd/config.yml on greencloud.
# `p-potvin` is already in server.allowed_owners, so nothing else changes there.
#
# Deux branches, une seule commande. Le script lit VW_REF pour savoir laquelle
# a été poussée : `main` va sur dev, `prod` bascule la production.
#
# ATTENTION — la forme liste exige le correctif appliqué le 27 août 2026 à
# /opt/vaultwares-adk/webhookd/vw_webhookd.py, qui accepte `branch` en chaîne
# (comportement historique) OU en liste. Sans lui, une cible dont `branch` est
# une liste ne correspond à aucune poussée et le dépôt cesse silencieusement de
# se déployer. Voir « Le correctif du répartiteur » dans README.md.

  p-potvin/linformaticien:
    branch: [main, prod]
    command: /var/www/deploy-scripts/deploy-linformaticien.sh
